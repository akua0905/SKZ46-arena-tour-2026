name: Ticket Monitor

on:
  schedule:
    # 4時間ごとに自動起動 (日本時間 0:15, 4:15, 8:15, 12:15, 16:15, 20:15)
    - cron: '15 15,19,23,3,7,11 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run monitor scripts
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node monitor.js

      - name: Notify Cancelled to Discord
        if: cancelled()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "【ローチケ監視｜監視中断】\n新しい監視プロセスが起動されたため、以前の監視処理を即座に終了しました。\n〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜"}' \
               $DISCORD_WEBHOOK
