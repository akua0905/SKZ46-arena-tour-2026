name: Lawson Ticket Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  monitor:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      - name: Install packages
        run: npm install


      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node monitor.js


      - name: Save hash
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update page hash"
          add: page_hash.txt
