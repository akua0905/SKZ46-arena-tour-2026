name: Lawson Ticket Monitor

on:
  schedule:
    - cron: "0 0,6,12,18 1-31 1-12 0-6"
  workflow_dispatch:

concurrency:
  group: ticket-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }} --rebase || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install packages
        run: npm install

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node monitor.js

      - name: Save ticket data
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update ticket monitor data"
          pull: "--rebase --autostash"
          add: |
            ticket_list.txt
            last_diff.txt
