name: Ticket Monitor

on:
  schedule:
    # 日本時間 0:00, 6:00, 12:00, 18:00 に自動起動 (UTC 15:00, 21:00, 3:00, 9:00)
    - cron: '0 15,21,3,9 * * *'
  workflow_dispatch:

# 新しい実行が来たら古い実行を即座にキャンセルする設定
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run monitor scripts
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node monitor.js

      # 新しい実行によって途中で中断された場合にDiscordへ通知を送る
      - name: Notify Cancelled to Discord
        if: cancelled()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "【ローチケ監視｜監視中断】\n新しい監視プロセスが起動されたため、以前の監視処理を即座に終了しました。\n〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜"}' \
               $DISCORD_WEBHOOK
