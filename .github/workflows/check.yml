name: Ticket Monitor

on:
  schedule:
    # 日本時間 0:00, 6:00, 12:00, 18:00 に自動起動 (UTC 15:00, 21:00, 3:00, 9:00)
    - cron: '0 15,21,3,9 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run monitor scripts
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node monitor.js
